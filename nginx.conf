# Same routing as vercel.json: /api goes to the Express server, every other
# path falls back to index.html so share links (/p/:slug) load the app.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:3001;
    }

    location / {
        try_files $uri /index.html;
    }
}
